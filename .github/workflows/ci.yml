name: OpenJules tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      OPENJULES_MANAGED_DOCKER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Docker availability
        run: docker info
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build the managed runtime fixture image
        run: |
          docker build --iidfile managed-test-image.id -f tests/fixtures/Dockerfile.managed-runtime .
          echo "OPENJULES_MANAGED_IMAGE_ID=$(cat managed-test-image.id)" >> "$GITHUB_ENV"
      - name: Build the managed coding-agent image
        run: |
          docker build --build-arg PYTHON_BASE=python:3.12-slim --iidfile managed-agent-image.id -f docker/Dockerfile.managed-agent .
          echo "OPENJULES_MANAGED_AGENT_IMAGE_ID=$(cat managed-agent-image.id)" >> "$GITHUB_ENV"
      - name: Run the full test suite
        run: python -m pytest -x
