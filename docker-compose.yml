services:
  dind:
    image: docker:27-dind
    privileged: true
    restart: unless-stopped
    # Explicit host-owned legacy runtime only; the disabled HTTP app needs none.
    profiles:
      - legacy-runtime
    environment:
      # Disables TLS for internal container-to-container communication on default network
      DOCKER_TLS_CERTDIR: ""
    volumes:
      # Persistent cache for sandboxed images and workspace layers
      - dind-data:/var/lib/docker
      - workspace-data:/workspace
    networks:
      - openjules-net
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional self-hosted vLLM inference server
  vllm:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - MODEL=${VLLM_MODEL:-Qwen/Qwen2.5-Coder-7B-Instruct}
    volumes:
      - vllm-models:/root/.cache/huggingface
    networks:
      - openjules-net
    profiles:
      - vllm

  # Optional self-hosted llama.cpp server
  llamacpp:
    image: ghcr.io/ggerganov/llama.cpp:server
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
    volumes:
      - llamacpp-models:/models
    networks:
      - openjules-net
    profiles:
      - llamacpp

  # Optional MQTT broker for Keystone Polyphony macro transport
  polyphony-mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    networks:
      - openjules-net
    profiles:
      - polyphony
      - swarm

  # Optional self-hosted Radicle Node service
  radicle-node:
    image: radicle/radicle-node:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - radicle-data:/root/.radicle
    networks:
      - openjules-net
    profiles:
      - radicle

  openjules:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    # Status-only default: no credentials, host source or execution state mounts.
    networks:
      - openjules-net

volumes:
  dind-data:
  workspace-data:
  radicle-data:
  vllm-models:
  llamacpp-models:

networks:
  openjules-net:
    driver: bridge
