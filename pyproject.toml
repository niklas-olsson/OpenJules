[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openjules"
version = "0.3.0"
description = "Autonomous Sandboxed Coding Agent Service"
authors = [{ name = "OpenJules Authors" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "docker>=7.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "PyGithub>=2.2.0",
    "litellm>=1.30.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "mcp==1.30.0",
]

[project.scripts]
openjules = "src.cli:main"
openjules-discussion = "src.worker.public_discussion:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src" = ["ui/static/standalone.html", "ui/static/standalone.css"]
